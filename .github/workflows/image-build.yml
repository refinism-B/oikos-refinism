name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:        # 允許從 GitHub Actions 頁面手動觸發

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # 自動對應 ghcr.io/<你的帳號>/<repo名稱>

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # 推送到 GHCR 所需

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # 無需手動建立，Actions 自動提供

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # 每次 push 都更新 latest
            type=raw,value=latest,enable={{is_default_branch}}
            # 同時保留 Git commit SHA，方便回溯
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 啟用 GitHub Actions cache 加速後續建置（SQLCipher 編譯耗時，快取很有幫助）
          cache-from: type=gha
          cache-to: type=gha,mode=max